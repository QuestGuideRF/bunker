<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Бункер</title>
  <link rel="icon" href="/favicons/favicon.ico" type="image/x-icon"><link rel="icon" href="/favicons/favicon-32x32.png" type="image/png" sizes="32x32">
  <style>
    :root { --bg:#0f0f14; --text:#e8e8f0; --text2:#9090b0; --accent:#7aa2f7; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
    }
    .container { max-width: 380px; }
    .emoji { font-size: 5rem; margin-bottom: 16px; display: block; }
    h1 { font-size: 4rem; font-weight: 900; color: var(--accent); }
    .title { font-size: 1.2rem; font-weight: 700; margin: 8px 0; }
    .desc { color: var(--text2); font-size: 0.9rem; margin-bottom: 28px; line-height: 1.5; }
    .btn {
      display: inline-block;
      padding: 13px 28px;
      background: #7AA2F7;
      color: #fff;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="emoji">🐱</span>
    <h1>404</h1>
    <div class="title">котенок не нашел куда идти</div>
    <div class="desc">Такой страницы не существует. Возможно, вы свернули не туда, или котёнок съел ссылку.</div>
    <a href="/" class="btn">На главную</a>
  </div>
</body>
</html>
